# /etc/sddm.conf.d/10-wayland-fallback.conf
# ONLY use this if SDDM's default greeter fails to start on OpenRC/elogind.
# The default SDDM X11 greeter with a Plasma Wayland user session usually
# works without this file.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
