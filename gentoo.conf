# /etc/portage/binrepos.conf/gentoo.conf
#
# Gentoo official binary package host (binhost) for amd64 23.0 profiles.
#
# This is NOT the ebuild repository configuration.  The ebuild repo is
# configured in /etc/portage/repos.conf/gentoo.conf (provided by stage3).
# This file only tells Portage where precompiled *.gpkg.tar packages live.
#
# The laptop supports x86-64-v3 (and even x86-64-v4).  Gentoo only publishes
# v3 binaries, so v3 is used first.  The baseline x86-64 repo is kept as a
# fallback for packages that are not yet available in the v3 set.
#
# Higher priority number = preferred repository.
# Binary package signatures are verified automatically with current Portage.

[gentoo-x86-64-v3]
priority = 9999
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/
location = /var/cache/binhost/gentoo-x86-64-v3

[gentoo]
priority = 9998
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
location = /var/cache/binhost/gentoo
