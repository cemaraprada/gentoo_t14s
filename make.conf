# /etc/portage/make.conf
#
# Target machine
# ---------------
# Lenovo ThinkPad T14s Gen 2i (20WNS51A00)
# CPU : Intel Core i5-1145G7 (Tiger Lake, 4 cores / 8 threads, AVX-512)
# GPU : Intel Iris Xe Graphics (Tiger Lake GT2, i915/xe)
# RAM : 16 GiB LPDDR4X-4267
# SSD : Micron 2300 NVMe 256 GB (/dev/nvme0n1)
# WiFi: Intel Wi-Fi 6 AX201 (iwlwifi)
# LAN : Intel I219-LM (e1000e)
# BT  : Intel Bluetooth (btusb/btintel)
# WWAN: Quectel EM120R-GL (mhi_pci_generic, optional ModemManager)
# Audio: Intel Tiger Lake SOF + Realtek ALC269
# FP  : Synaptics 06cb:00f9 (libfprint/fprintd)
#
# Target: Gentoo amd64, OpenRC, KDE Plasma 6 Wayland.
# The official binary host is used first; anything whose USE flags do not
# match the binhost is built locally with the flags below.

# ---------------------------------------------------------------------------
# Compiler
# ---------------------------------------------------------------------------
# 'tigerlake' is the exact -march/-mtune reported by GCC on this laptop.
# If you want to be able to move this install to another x86-64 machine,
# use "-O2 -pipe -march=x86-64-v3" instead.
COMMON_FLAGS="-O2 -pipe -march=tigerlake"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Generated from the i5-1145G7 CPUID flags. You can verify inside the
# Gentoo live environment with: cpuid2cpuflags
CPU_FLAGS_X86="aes avx avx2 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3"

# ---------------------------------------------------------------------------
# Portage parallelism
# ---------------------------------------------------------------------------
# 4C/8T + 16 GiB RAM. Reduce to -j4 if the laptop throttles or runs hot.
MAKEOPTS="-j8 -l8"
EMERGE_DEFAULT_OPTS="--jobs=4 --load-average=8 --with-bdeps=y"

# ---------------------------------------------------------------------------
# Binary packages (official Gentoo binhost)
# ---------------------------------------------------------------------------
# The host definitions live in /etc/portage/binrepos.conf/gentoo.conf
# (x86-64-v3 first, baseline x86-64 as fallback).
FEATURES="getbinpkg parallel-fetch"

# Optional: keep locally built packages in GPKG format / zstd compression.
# BINPKG_FORMAT="gpkg"
# BINPKG_COMPRESS="zstd"

# ---------------------------------------------------------------------------
# Language / licences
# ---------------------------------------------------------------------------
LINGUAS="en"
# Chrome is proprietary; remove this if you do not want Google Chrome.
# @BINARY-REDISTRIBUTABLE is needed for linux-firmware / intel-microcode.
ACCEPT_LICENSE="@FREE @BINARY-REDISTRIBUTABLE google-chrome"

# ---------------------------------------------------------------------------
# Hardware / graphics / input
# ---------------------------------------------------------------------------
# i915 is used by Mesa on Tiger Lake.  'intel' also covers the xe driver
# userspace if you later switch kernels.
VIDEO_CARDS="intel"
INPUT_DEVICES="libinput"

# ---------------------------------------------------------------------------
# Global USE flags
# ---------------------------------------------------------------------------
USE="
    elogind
    -systemd
    dbus
    udev
    policykit
    wayland
    X
    kde
    bluetooth
    networkmanager
    pipewire
    pulseaudio
    vaapi
    vulkan
    opengl
    gles2
    ffmpeg
    -gnome
    -cups
"

# Optional: choose a nearby Gentoo mirror.
# GENTOO_MIRRORS="https://your-nearest-mirror.example/gentoo/"
